
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Ninja 2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:linear-gradient(160deg,#080d29,#25104b);
 color:white;font-family:Arial;
 overflow:hidden;touch-action:none;
}
canvas{display:block;width:100vw;height:100dvh}
#hud{
 position:absolute;top:12px;width:100%;
 display:flex;justify-content:space-around;
 font-size:17px;font-weight:bold;
 pointer-events:none;
}
#pause{
 position:absolute;right:12px;top:55px;
 padding:9px 15px;border:0;border-radius:20px;
 background:#fff;color:#222;font-weight:bold;
}
#menu{
 position:absolute;inset:0;
 background:#070b22ed;
 display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 text-align:center;gap:15px;
}
h1{font-size:38px;color:#ffdb36}
button{
 border:0;border-radius:30px;
 padding:14px 30px;font-size:18px;
 font-weight:bold;background:#ffbd22;color:#222;
}
p{color:#ddd}
.hide{display:none!important}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div>🏆 <span id="score">0</span></div>
 <div>❤️ <span id="lives">3</span></div>
 <div>⭐ <span id="best">0</span></div>
</div>

<button id="pause">⏸ Pause</button>

<div id="menu">
 <h1>🍉 FRUIT NINJA</h1>
 <h2 id="message">FRUIT CUTTING GAME</h2>
 <p>फल काटो और बम से बचो!</p>
 <button id="start">▶ START GAME</button>
 <p>Touch and swipe to cut fruits</p>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

let W=0,H=0,D=1;
let score=0,lives=3,best=0;
let objects=[],particles=[],trails=[];
let running=false,paused=false;
let last=0,spawnTimer=0;
let pointer=null,audio=null;
let animation=0;

const fruits=[
 {e:"🍉",p:10},{e:"🍎",p:10},
 {e:"🍊",p:10},{e:"🍌",p:15},
 {e:"🍍",p:15},{e:"🥝",p:20},
 {e:"🍓",p:15},{e:"🍇",p:20},
 {e:"🥥",p:20},{e:"🍐",p:10}
];

try{best=Number(localStorage.getItem("fruitBest"))||0}catch(e){}
$("best").textContent=best;

function resize(){
 D=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;H=window.innerHeight;
 canvas.width=Math.round(W*D);
 canvas.height=Math.round(H*D);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(D,0,0,D,0,0);
}
window.addEventListener("resize",resize);
resize();

function sound(freq=500){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.connect(g);g.connect(audio.destination);
  o.frequency.value=freq;
  g.gain.setValueAtTime(.07,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);
  o.start();o.stop(audio.currentTime+.14);
 }catch(e){}
}

function hud(){
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("best").textContent=best;
}

function spawn(){
 const bomb=Math.random()<.14;
 const f=bomb?null:fruits[Math.floor(Math.random()*fruits.length)];
 const x=45+Math.random()*(W-90);
 objects.push({
  x,y:H+35,
  vx:(Math.random()-.5)*5,
  vy:-(12+Math.random()*5+score/500),
  r:28+Math.random()*10,
  emoji:bomb?"💣":f.e,
  points:bomb?0:f.p,
  bomb,cut:false
 });
}

function burst(x,y,bomb){
 for(let i=0;i<16;i++){
  const a=Math.random()*Math.PI*2;
  const s=2+Math.random()*5;
  particles.push({
   x,y,vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:30,
   color:bomb?"#ff3030":`hsl(${Math.random()*60+20},100%,60%)`
  });
 }
}

function endGame(){
 running=false;
 cancelAnimationFrame(animation);
 $("menu").classList.remove("hide");
 $("message").textContent="GAME OVER! Score: "+score;
 $("start").textContent="🔄 PLAY AGAIN";
 $("pause").classList.add("hide");
}

function cut(f){
 if(f.cut||!running||paused)return;
 f.cut=true;
 burst(f.x,f.y,f.bomb);
 if(f.bomb){
  lives--;
  sound(100);
  if(lives<=0){hud();endGame();return;}
 }else{
  score+=f.points;
  sound(600);
  if(score>best){
   best=score;
   try{localStorage.setItem("fruitBest",best)}catch(e){}
  }
 }
 hud();
}

function start(){
 cancelAnimationFrame(animation);
 score=0;lives=3;
 objects=[];particles=[];trails=[];
 spawnTimer=0;
 paused=false;running=true;
 $("pause").textContent="⏸ Pause";
 $("pause").classList.remove("hide");
 $("menu").classList.add("hide");
 hud();
 last=performance.now();
 animation=requestAnimationFrame(loop);
}

function togglePause(){
 if(!running)return;
 paused=!paused;
 $("pause").textContent=paused?"▶ Resume":"⏸ Pause";
 if(!paused){
  last=performance.now();
  animation=requestAnimationFrame(loop);
 }
}

function loop(now){
 if(!running||paused)return;

 const dt=Math.min((now-last)/16.67,2);
 last=now;

 ctx.clearRect(0,0,W,H);

 // Background decoration
 for(let i=0;i<20;i++){
  ctx.fillStyle="rgba(255,255,255,.035)";
  ctx.beginPath();
  ctx.arc((i*137)%W,(i*211)%H,2,0,Math.PI*2);
  ctx.fill();
 }

 spawnTimer+=dt;
 const interval=Math.max(24,65-score/80);
 if(spawnTimer>interval){
  spawn();
  if(Math.random()<.30)spawn();
  spawnTimer=0;
 }

 for(let i=objects.length-1;i>=0;i--){
  const f=objects[i];
  f.x+=f.vx*dt;
  f.y+=f.vy*dt;
  f.vy+=.29*dt;

  if(!f.cut){
   ctx.font=(f.r*2)+"px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText(f.emoji,f.x,f.y);
  }

  if(f.y>H+70){
   if(!f.cut&&!f.bomb){
    lives--;
    hud();
    if(lives<=0){endGame();return;}
   }
   objects.splice(i,1);
  }else if(f.cut&&f.y>H+50){
   objects.splice(i,1);
  }
 }

 // Particles
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=.16*dt;p.life-=dt;
  ctx.globalAlpha=Math.max(0,p.life/30);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,4,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  if(p.life<=0)particles.splice(i,1);
 }

 // Cutting trail
 if(trails.length){
  ctx.beginPath();
  ctx.moveTo(trails[0].x,trails[0].y);
  for(const t of trails)ctx.lineTo(t.x,t.y);
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=5;
  ctx.lineCap="round";
  ctx.shadowBlur=15;
  ctx.shadowColor="#00ffff";
  ctx.stroke();
  ctx.shadowBlur=0;
  for(let i=trails.length-1;i>=0;i--){
   trails[i].life-=dt;
   if(trails[i].life<=0)trails.splice(i,1);
  }
 }

 animation=requestAnimationFrame(loop);
}

function position(e){
 const r=canvas.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener("pointerdown",e=>{
 if(!running||paused)return;
 pointer=position(e);
 trails.push({...pointer,life:10});
});

canvas.addEventListener("pointermove",e=>{
 if(!pointer||!running||paused)return;
 const p=position(e);
 trails.push({...p,life:10});
 if(trails.length>15)trails.shift();

 for(const f of objects){
  if(f.cut)continue;
  const d=Math.hypot(f.x-p.x,f.y-p.y);
  if(d<f.r+15)cut(f);
 }
 pointer=p;
});

function release(){
 pointer=null;
}
window.addEventListener("pointerup",release);
window.addEventListener("pointercancel",release);

$("start").addEventListener("click",()=>{
 sound(500);
 start();
});

$("pause").addEventListener("click",togglePause);

hud();
})();
</script>
</body>
</html>
