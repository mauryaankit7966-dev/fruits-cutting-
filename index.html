
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fruit Cutting Game</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
 background:linear-gradient(180deg,#72dcff,#c9f8ff,#faffd9);
 color:#172554;
}

canvas{
 display:block;
 width:100vw;
 height:100dvh;
}

#hud{
 position:absolute;
 top:12px;
 left:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 align-items:center;
 gap:5px;
 pointer-events:none;
}

.scorebox{
 background:#ffffffeb;
 color:#172554;
 padding:9px 13px;
 border-radius:18px;
 font-weight:bold;
 font-size:17px;
 box-shadow:0 3px 10px #456a8840;
}

#pause{
 position:absolute;
 top:68px;
 right:12px;
 padding:10px 17px;
 border:none;
 border-radius:20px;
 background:#ffffff;
 color:#172554;
 font-weight:bold;
 font-size:15px;
 box-shadow:0 3px 10px #456a8840;
}

#menu{
 position:absolute;
 inset:0;
 background:#eafaffed;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 gap:17px;
 padding:20px;
}

#menu h1{
 color:#ff5a36;
 font-size:37px;
 text-shadow:2px 3px #ffd44d;
}

#menu p{
 color:#19365b;
 font-size:17px;
}

#start{
 background:linear-gradient(45deg,#ff6b24,#ffcf28);
 color:white;
 font-size:21px;
 font-weight:bold;
 padding:15px 40px;
 border:0;
 border-radius:30px;
 box-shadow:0 5px 0 #dc761c;
}

#start:active{
 transform:translateY(3px);
 box-shadow:0 2px 0 #dc761c;
}

.hide{display:none!important}

#tip{
 position:absolute;
 bottom:15px;
 width:100%;
 text-align:center;
 color:#234c6b;
 font-weight:bold;
 font-size:13px;
 pointer-events:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="scorebox">🏆 <span id="score">0</span></div>
 <div class="scorebox">❤️ <span id="lives">3</span></div>
 <div class="scorebox">⭐ <span id="best">0</span></div>
</div>

<button id="pause" class="hide">⏸ Pause</button>

<div id="menu">
 <h1>🍉 FRUIT NINJA 🍓</h1>
 <h2 id="message">FRUIT CUTTING GAME</h2>
 <p>फल काटो और बम से बचो!</p>
 <button id="start">▶ START GAME</button>
 <p>अपनी उंगली से फल पर Swipe करें</p>
</div>

<div id="tip">🍎 CUT FRUITS • 💣 AVOID BOMBS 🍉</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

let W=0,H=0,D=1;
let score=0,lives=3,best=0;
let fruits=[],particles=[],trails=[];
let running=false,paused=false;
let last=0,spawnTimer=0;
let pointer=null,animation=0,audio=null;

const fruitList=[
 {emoji:"🍉",points:10},
 {emoji:"🍎",points:10},
 {emoji:"🍊",points:10},
 {emoji:"🍌",points:15},
 {emoji:"🍍",points:15},
 {emoji:"🥝",points:20},
 {emoji:"🍓",points:15},
 {emoji:"🍇",points:20},
 {emoji:"🍐",points:10},
 {emoji:"🥥",points:20}
];

try{
 best=Number(localStorage.getItem("fruitBest"))||0;
}catch(e){}

$("best").textContent=best;

function resize(){
 D=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;
 H=window.innerHeight;

 canvas.width=Math.round(W*D);
 canvas.height=Math.round(H*D);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(D,0,0,D,0,0);
}

window.addEventListener("resize",resize);
resize();

function sound(freq=500){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();

  const o=audio.createOscillator();
  const g=audio.createGain();

  o.connect(g);
  g.connect(audio.destination);

  o.frequency.value=freq;
  g.gain.setValueAtTime(.07,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);

  o.start();
  o.stop(audio.currentTime+.16);
 }catch(e){}
}

function updateHUD(){
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("best").textContent=best;
}

function background(){
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#68d9ff");
 bg.addColorStop(.55,"#b8f2ff");
 bg.addColorStop(1,"#fff8c9");

 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 // Background decoration
 for(let i=0;i<18;i++){
  const x=(i*139+40)%W;
  const y=(i*193+80)%H;

  ctx.fillStyle="rgba(255,255,255,.35)";
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fill();
 }
}

function spawnFruit(){
 const bomb=Math.random()<.14;
 const f=bomb?null:fruitList[
  Math.floor(Math.random()*fruitList.length)
 ];

 const r=Math.min(43,Math.max(32,W*.075));

 fruits.push({
  x:45+Math.random()*(W-90),
  y:H+45,
  vx:(Math.random()-.5)*4,
  vy:-(13+Math.random()*4+score/500),
  r,
  emoji:bomb?"💣":f.emoji,
  points:bomb?0:f.points,
  bomb,
  cut:false
 });
}

function createParticles(x,y,bomb){
 for(let i=0;i<18;i++){
  const angle=Math.random()*Math.PI*2;
  const speed=2+Math.random()*5;

  particles.push({
   x,y,
   vx:Math.cos(angle)*speed,
   vy:Math.sin(angle)*speed,
   life:35,
   color:bomb?
    "#ff3333":
    ["#ffcf25","#ff4e43","#38bd55","#ff8b35","#ff65ad"][Math.floor(Math.random()*5)]
  });
 }
}

function cutFruit(f){
 if(f.cut||!running||paused)return;

 f.cut=true;
 createParticles(f.x,f.y,f.bomb);

 if(f.bomb){
  lives--;
  sound(100);

  if(lives<=0){
   updateHUD();
   gameOver();
   return;
  }
 }else{
  score+=f.points;
  sound(650);

  if(score>best){
   best=score;
   try{
    localStorage.setItem("fruitBest",best);
   }catch(e){}
  }
 }

 updateHUD();
}

function gameOver(){
 running=false;
 cancelAnimationFrame(animation);
 $("menu").classList.remove("hide");
 $("message").textContent="GAME OVER! Score: "+score;
 $("start").textContent="🔄 PLAY AGAIN";
 $("pause").classList.add("hide");
}

function startGame(){
 cancelAnimationFrame(animation);

 score=0;
 lives=3;
 fruits=[];
 particles=[];
 trails=[];
 spawnTimer=0;
 pointer=null;

 running=true;
 paused=false;

 updateHUD();

 $("menu").classList.add("hide");
 $("pause").classList.remove("hide");
 $("pause").textContent="⏸ Pause";

 last=performance.now();
 animation=requestAnimationFrame(loop);
}

function togglePause(){
 if(!running)return;

 paused=!paused;

 if(paused){
  cancelAnimationFrame(animation);
  $("pause").textContent="▶ Resume";
 }else{
  $("pause").textContent="⏸ Pause";
  last=performance.now();
  animation=requestAnimationFrame(loop);
 }
}

function drawFruit(f){
 ctx.save();

 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.font=`${f.r*2.15}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;

 ctx.shadowColor="rgba(20,50,80,.25)";
 ctx.shadowBlur=7;
 ctx.fillText(f.emoji,f.x,f.y);

 ctx.restore();
}

function loop(now){
 if(!running||paused)return;

 const dt=Math.min((now-last)/16.67,2);
 last=now;

 background();

 // Fruit spawning
 spawnTimer+=dt;

 const interval=Math.max(25,65-score/100);

 if(spawnTimer>interval){
  spawnFruit();

  if(Math.random()<.25)spawnFruit();

  spawnTimer=0;
 }

 // Fruits movement
 for(let i=fruits.length-1;i>=0;i--){
  const f=fruits[i];

  f.x+=f.vx*dt;
  f.y+=f.vy*dt;
  f.vy+=.30*dt;

  if(!f.cut)drawFruit(f);

  if(f.y>H+70){
   if(!f.cut&&!f.bomb){
    lives--;
    updateHUD();

    if(lives<=0){
     gameOver();
     return;
    }
   }

   fruits.splice(i,1);
  }
 }

 // Particles
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=.15*dt;
  p.life-=dt;

  ctx.globalAlpha=Math.max(0,p.life/35);
  ctx.fillStyle=p.color;

  ctx.beginPath();
  ctx.arc(p.x,p.y,5,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;

  if(p.life<=0)particles.splice(i,1);
 }

 // Swipe trail
 for(let i=trails.length-1;i>=0;i--){
  trails[i].life-=dt;
  if(trails[i].life<=0)trails.splice(i,1);
 }

 if(trails.length>1){
  ctx.beginPath();
  ctx.moveTo(trails[0].x,trails[0].y);

  for(const t of trails){
   ctx.lineTo(t.x,t.y);
  }

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=6;
  ctx.lineCap="round";
  ctx.shadowBlur=12;
  ctx.shadowColor="#008cff";
  ctx.stroke();
  ctx.shadowBlur=0;
 }

 animation=requestAnimationFrame(loop);
}

function getPosition(e){
 const rect=canvas.getBoundingClientRect();

 return{
  x:e.clientX-rect.left,
  y:e.clientY-rect.top
 };
}

canvas.addEventListener("pointerdown",e=>{
 if(!running||paused)return;

 pointer=getPosition(e);

 trails.push({...pointer,life:10});
});

canvas.addEventListener("pointermove",e=>{
 if(!pointer||!running||paused)return;

 const p=getPosition(e);

 trails.push({...p,life:10});

 if(trails.length>15)trails.shift();

 for(const f of fruits){
  if(f.cut)continue;

  const distance=Math.hypot(
   f.x-p.x,
   f.y-p.y
  );

  if(distance<f.r+20){
   cutFruit(f);
  }
 }

 pointer=p;
});

window.addEventListener("pointerup",()=>{
 pointer=null;
});

window.addEventListener("pointercancel",()=>{
 pointer=null;
});

$("start").addEventListener("click",()=>{
 sound(500);
 startGame();
});

$("pause").addEventListener("click",togglePause);

updateHUD();
background();

})();
</script>

</body>
</html>
